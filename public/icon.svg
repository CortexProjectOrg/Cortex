<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cortexTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#223b2c" />
      <stop offset="100%" stop-color="#14241b" />
    </linearGradient>
    <linearGradient id="branchWood" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d6e4cb" />
      <stop offset="100%" stop-color="#edf6e7" />
    </linearGradient>
  </defs>

  <!-- App icon tile -->
  <rect width="512" height="512" rx="112" fill="url(#cortexTile)" />

  <!-- Organic Tree Trunk and Branch Canopy -->
  <g fill="none" stroke="url(#branchWood)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Flared root & main trunk -->
    <path d="M 226 438 C 238 438 245 390 248 320 L 264 320 C 267 390 274 438 286 438 Z" fill="url(#branchWood)" stroke-width="1" />

    <!-- Central upright branch to apex -->
    <path d="M 256 320 C 256 240 256 170 256 115" stroke-width="14" />

    <!-- Inner boughs arching to upper-tier cards -->
    <path d="M 256 290 C 242 245 205 195 180 165" stroke-width="12" />
    <path d="M 256 290 C 270 245 307 195 332 165" stroke-width="12" />

    <!-- Sweeping boughs arching outward and up to mid-tier cards -->
    <path d="M 252 315 C 215 285 145 255 105 225" stroke-width="12" />
    <path d="M 260 315 C 297 285 367 255 407 225" stroke-width="12" />

    <!-- Lower crown boughs arching smoothly to base cards -->
    <path d="M 250 340 C 200 340 160 325 130 305" stroke-width="11" />
    <path d="M 262 340 C 312 340 352 325 382 305" stroke-width="11" />
  </g>

  <!-- Knowledge Leaf Node Cards -->
  <g stroke="#182c20" stroke-width="3.5">
    <!-- Apex card (top center: pale sage highlight) -->
    <rect x="218" y="65" width="76" height="52" rx="14" fill="#dbe6c0" />

    <!-- Upper tier cards (leaf green) -->
    <rect x="145" y="118" width="70" height="50" rx="13" fill="#8caa7c" />
    <rect x="297" y="118" width="70" height="50" rx="13" fill="#8caa7c" />

    <!-- Mid tier cards (forest sage) -->
    <rect x="70" y="178" width="70" height="50" rx="13" fill="#588264" />
    <rect x="372" y="178" width="70" height="50" rx="13" fill="#588264" />

    <!-- Lower tier cards (warm amber/gold curriculum accent) -->
    <rect x="95" y="260" width="70" height="50" rx="13" fill="#d4b476" />
    <rect x="347" y="260" width="70" height="50" rx="13" fill="#d4b476" />
  </g>
</svg>
